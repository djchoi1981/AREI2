<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알파생태연구원 - 상세 페이지</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Subpage Specific Styles */
        .subpage-header {
            padding: 150px 0 60px 0;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
            color: var(--color-white);
            text-align: center;
        }
        .subpage-header h1 {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .subpage-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .subpage-content {
            padding: 80px 0;
            background: var(--color-bg);
            min-height: 50vh;
        }
        
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .list-item {
            background: var(--color-surface);
            padding: 32px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-soft);
            border-left: 4px solid var(--color-secondary);
            transition: var(--transition);
        }
        
        .list-item:hover {
            transform: translateX(10px);
            border-left-color: var(--color-accent);
        }
        
        .list-item h3 {
            font-size: 1.3rem;
            color: var(--color-primary);
            margin-bottom: 12px;
        }
        
        .list-item p {
            color: var(--color-text-muted);
            font-size: 1rem;
        }
        
        .back-btn {
            display: inline-block;
            margin-top: 40px;
            padding: 10px 24px;
            border-radius: 20px;
            border: 1px solid var(--color-primary-light);
            color: var(--color-primary-light);
            font-weight: 500;
        }
        .back-btn:hover {
            background: var(--color-primary-light);
            color: var(--color-white);
        }
        
        @media (max-width: 768px) {
            .subpage-header { padding: 120px 0 40px 0; }
            .subpage-header h1 { font-size: 2.2rem; }
            .list-item { padding: 24px; }
        }
    </style>
</head>
<body>
    <!-- Navbar (Same as index.html) -->
    <header class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo" id="logo-container">
                <img id="logo-img" src="" alt="알파생태연구원 로고" style="display: none;">
                <span id="logo-text">알파생태연구원</span>
            </a>
            <nav>
                <ul class="nav-links" id="nav-links">
                    <li><a href="index.html#about">연구원 소개</a></li>
                    <li><a href="index.html#research">연구 분야</a></li>
                    <li><a href="index.html#resources">자료실</a></li>
                    <li><a href="index.html#contact">오시는 길</a></li>
                    <li><a href="#" onclick="openAdmin(event)" title="관리자 모드">⚙️</a></li>
                </ul>
            </nav>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- Subpage Header -->
    <section class="subpage-header">
        <div class="container fade-up visible">
            <h1 id="page-title">불러오는 중...</h1>
            <p id="page-desc"></p>
        </div>
    </section>

    <!-- Subpage Content -->
    <section class="subpage-content">
        <div class="container">
            <div class="list-container" id="list-container">
                <!-- JS will populate list items here -->
            </div>
            
            <div class="text-center fade-up visible">
                <a href="index.html" class="back-btn">← 메인으로 돌아가기</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <h2 class="footer-logo">알파생태연구원</h2>
            <p id="footer-copyright">© 2026 Alpha Ecology Research Institute.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/subpage.js"></script>
    <script>
        function openAdmin(e) {
            e.preventDefault();
            const pwd = prompt("관리자 비밀번호를 입력하세요:");
            if (pwd === siteData.admin.password) {
                window.location.href = 'admin.html';
            } else if (pwd !== null) {
                alert("비밀번호가 틀렸습니다.");
            }
        }
    </script>
</body>
</html>
