<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료실 - 알파생태연구원</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .drive-container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .drive-iframe-wrapper {
            width: 100%;
            height: 600px;
            border: 2px solid #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .instruction-box {
            background-color: #f8f9fa;
            border-left: 4px solid var(--color-primary);
            padding: 15px 20px;
            text-align: left;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Navbar (Same as subpage) -->
    <header class="navbar scrolled" id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo" id="logo-container">
                <img id="logo-img" src="" alt="알파생태연구원 로고" style="display: none;">
                <span id="logo-text">알파생태연구원</span>
            </a>
            <nav>
                <ul class="nav-links" id="nav-links">
                    <!-- JS will populate this -->
                </ul>
            </nav>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <section class="subpage-header">
        <div class="container fade-up visible">
            <h1 id="page-title">자료실</h1>
            <p id="page-desc">연구 성과 및 관련 자료를 확인하고 다운로드 하실 수 있습니다.</p>
        </div>
    </section>

    <section class="subpage-content">
        <div class="container">
            <!-- 구글 드라이브 자료실 -->
            <div class="drive-container fade-up visible">
                <h2 style="font-size: 1.8rem; margin-bottom: 20px; color: var(--color-primary);">통합 자료실 (Google Drive)</h2>
                
                <div class="drive-iframe-wrapper">
                    <!-- 구글 드라이브 폴더가 임베딩될 영역 -->
                    <iframe id="driveIframe" src="" width="100%" height="100%" frameborder="0" style="display:none;"></iframe>
                    <div id="drivePlaceholder" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-color: #f9f9f9; color: #888;">
                        구글 드라이브 폴더가 아직 연결되지 않았습니다.
                    </div>
                </div>

            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container text-center">
            <img id="footer-logo-img" src="" alt="알파생태연구원 로고" style="display: none; max-width: 200px; margin: 0 auto 15px auto;">
            <h3 id="footer-logo-text" style="margin-bottom: 15px;">알파생태연구원</h3>
            <p id="footer-copyright">© 2026 Alpha Ecology Research Institute.</p>
        </div>
    </footer>

    <!-- Data and App JS (for Nav/Footer/Colors) -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Apply logo/colors on load
        if (siteData.header.logoImage && siteData.header.logoImage !== "") {
            const logoImg = document.getElementById('logo-img');
            logoImg.src = siteData.header.logoImage;
            logoImg.style.display = 'block';
            document.getElementById('logo-text').style.display = 'none';

            const footerLogoImg = document.getElementById('footer-logo-img');
            footerLogoImg.src = siteData.header.logoImage;
            footerLogoImg.style.display = 'block';
            document.getElementById('footer-logo-text').style.display = 'none';
        } else {
            document.getElementById('logo-text').textContent = siteData.header.logoText;
            document.getElementById('footer-logo-text').textContent = siteData.header.logoText;
        }
        document.getElementById('footer-copyright').textContent = siteData.footer.copyright;
        
        // Hamburger
        document.querySelector('.hamburger').addEventListener('click', () => {
            document.getElementById('nav-links').classList.toggle('active');
        });

        // Google Drive Iframe 로직
        function loadDriveIframe() {
            // data.js에 저장된 폴더 ID 가져오기
            const folderId = siteData.resources.driveFolderId;
            const iframe = document.getElementById('driveIframe');
            const placeholder = document.getElementById('drivePlaceholder');

            if (folderId && folderId.trim() !== "") {
                iframe.src = `https://drive.google.com/embeddedfolderview?id=${folderId}#list`;
                iframe.style.display = 'block';
                placeholder.style.display = 'none';
                document.getElementById('admin-instruction').style.display = 'none'; // 숨김
            } else {
                iframe.style.display = 'none';
                placeholder.style.display = 'flex';
            }
        }

        // 페이지 로드 시 실행
        window.addEventListener('DOMContentLoaded', () => {
            loadDriveIframe();
        });
    </script>
</body>
</html>
