<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알파생태연구원 - Alpha Ecology Research Institute</title>
    <meta name="description" content="대한민국 담수 생태계 복원과 수산자원의 지속가능한 이용을 연구하는 알파생태연구원입니다.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="#" class="logo" id="logo-container">
                <img id="logo-img" src="" alt="알파생태연구원 로고" style="display: none;">
                <span id="logo-text">알파생태연구원</span>
            </a>
            <nav>
                <ul class="nav-links" id="nav-links">
                    <!-- JS will populate this -->
                </ul>
            </nav>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-overlay"></div>
        <div class="container hero-layout">
            <div class="hero-content">
                <h1 id="hero-title" class="fade-up">생명과 환경의 조화<br>알파생태연구원</h1>
                <p id="hero-subtitle" class="fade-up delay-1">내수면 생태계 복원과 지속가능한 어류 자원 연구를 선도합니다.</p>
                <a href="#research" class="btn primary-btn fade-up delay-2" id="hero-btn">연구분야 보기</a>
            </div>
        </div>
        <div class="scroll-indicator fade-up delay-2">
            <a href="#about"><i class="icon-down-arrow"></i></a>
        </div>
    </section>

    <!-- About Section -->
    <section class="about section-padding" id="about">
        <div class="container about-layout">
            <div class="about-text fade-up">
                <span class="sub-heading-line" id="about-title">소개</span>
                <p id="about-desc">
                    <!-- JS will populate -->
                </p>
            </div>
            <div class="about-stats fade-up delay-1" id="about-stats">
                <!-- JS will populate -->
            </div>
        </div>
    </section>

    <!-- Research Section -->
    <section class="research section-padding bg-alt" id="research">
        <div class="container text-center">
            <span class="sub-heading-line mx-auto" id="research-title">연구분야</span>
            <div class="research-grid mt-4" id="research-grid">
                <!-- JS will populate -->
            </div>
        </div>
    </section>

    <!-- National Projects Section [NEW] -->
    <section class="national-projects section-padding" id="projects">
        <div class="container text-center">
            <span class="sub-heading-line mx-auto" id="projects-title">국가과제</span>
            <div class="projects-layout mt-4" id="projects-container">
                <!-- JS will populate -->
            </div>
        </div>
    </section>

    <!-- Research Process Section [NEW] -->
    <section class="research-process section-padding bg-alt" id="process">
        <div class="container text-center">
            <span class="sub-heading-line mx-auto" id="process-title">연구 프로세스</span>
            <div class="process-layout mt-4" id="process-container">
                <!-- JS will populate -->
            </div>
        </div>
    </section>

    <!-- Research Outcomes Section -->
    <section class="outcomes section-padding" id="outcomes">
        <div class="container text-center">
            <span class="sub-heading-line mx-auto" id="outcomes-title">연구성과</span>
            
            <div class="outcomes-filters mt-4" id="outcomes-filters">
                <!-- Tabs will be populated here -->
            </div>
            
            <div class="outcomes-layout mt-4 text-left">
                <div class="outcomes-achievements">
                    <h3>주요 성과</h3>
                    <div class="achievements-grid" id="achievements-grid">
                        <!-- JS will populate -->
                    </div>
                </div>
                <div class="outcomes-reports">
                    <h3>연구보고서 다운로드</h3>
                    <div class="reports-grid" id="reports-grid">
                        <!-- JS will populate -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Gallery & News Section [NEW] -->
    <section class="gallery-news section-padding bg-alt" id="news">
        <div class="container gallery-news-layout">
            <div class="gallery-section fade-up">
                <h3>현장 갤러리</h3>
                <div class="gallery-image-wrapper mt-3">
                    <img id="gallery-image" src="" alt="현장 갤러리 이미지">
                </div>
            </div>
            <div class="news-section fade-up delay-1">
                <h3>소식</h3>
                <div class="news-list mt-3" id="news-list">
                    <!-- JS will populate -->
                </div>
            </div>
        </div>
    </section>

    <!-- Contact & Footer Section -->
    <footer class="contact-footer" id="contact">
        <div class="container footer-layout">
            <div class="footer-info fade-up">
                <h2 id="contact-title">함께 만드는 건강한 하천,<br>연구협력을 기다립니다</h2>
                <p id="contact-subtitle" class="mt-2 text-muted">연구·조사·정책 수립 등 다양한 분야에서 협력 파트너십을 환영합니다.</p>
                <ul class="footer-contact-details mt-4">
                    <li><span class="icon">✉️</span> <span id="contact-email"></span></li>
                    <li><span class="icon">📞</span> <span id="contact-phone"></span></li>
                    <li><span class="icon">📍</span> <span id="contact-address"></span></li>
                </ul>
            </div>
            <div class="footer-form fade-up delay-1">
                <form id="contact-form">
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" placeholder="이름을 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label>소속/기관</label>
                        <input type="text" placeholder="소속 또는 기관명을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label>이메일</label>
                        <input type="email" placeholder="이메일을 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label>문의내용</label>
                        <textarea placeholder="문의 내용을 입력하세요" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn primary-btn mt-3" style="width: 100%; border-radius: 4px;">문의하기</button>
                </form>
            </div>
        </div>
        <div class="footer-bottom container mt-5">
            <div class="footer-bottom-flex">
                <div class="footer-brand">
                    <img id="footer-logo-img" src="" alt="로고" style="display: none;">
                    <span id="footer-logo-text">알파생태연구원</span>
                </div>
                <div class="footer-copyright">
                    <p id="footer-company-info"></p>
                    <p id="footer-copyright-text">© 2026 Alpha Ecology Research Institute. All rights reserved.</p>
                </div>
                <div class="footer-admin">
                    <a href="#" onclick="openAdmin(event)">개인정보처리방침</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        function openAdmin(e) {
            e.preventDefault();
            const pwd = prompt("관리자 비밀번호를 입력하세요:");
            if (pwd === siteData.admin.password) {
                window.location.href = 'admin.html';
            } else if (pwd !== null) {
                alert("비밀번호가 틀렸습니다.");
            }
        }
    </script>
</body>
</html>
